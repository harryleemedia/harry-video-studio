<!doctype html>
<!--
  audio-app-ui「With media」样片（音乐软件配乐）· Harry 版。15 秒，1920x1080，30fps，和图形版 audio-app-ui.mp4 节拍对齐。
  项目结构：本文件改名为 index.html，旁边放 templates/motion/ 里的 studio.js、hyperframes.json、meta.json，素材放 media/。
  media/ 里的文件（都来自 assets/me/，原文件不要改）：
    walk.mp4        = assets/me/ai-walk.mp4 原样复制（代替原片里跑步的人）
    turn.mp4        = assets/me/ai-turn.mp4 原样复制（代替结尾跳舞的人，从 1.5 s 起用，13.5 s 正面落在拍点上）
    webcam169.mp4   = assets/me/webcam.mp4 前 15 s 转成 16:9：中间清晰画面（裁 864x840@y30，缩到 720 高，左右羽化）叠在模糊压暗的同片背景上，脸完整入镜
                      ffmpeg -ss 0 -t 15.2 -i webcam.mp4 -filter_complex "[0:v]split[a][b];[a]scale=1280:1600,crop=1280:720:0:180,gblur=sigma=30,eq=brightness=-0.13:saturation=0.8[bg];[b]crop=864:840:0:30,scale=-2:720,format=rgba,geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='255*clip(min(X,W-1-X)/56,0,1)'[fg];[bg][fg]overlay=(W-w)/2:0,fps=30,format=yuv420p" -an webcam169.mp4
    st_wtight.jpg   = webcam169.mp4 第 9 s 的近景（crop=948:533:166:30），跳切用
    st_walk.jpg / st_walk2.jpg = walk.mp4 第 1.6 s / 4.3 s；st_turn.jpg / st_turn2.jpg = turn.mp4 第 1.2 s / 0.2 s（宽 640）
    th_*.jpg        = 视频轨缩略图（宽 240）：th_w1 = webcam169 第 4 s，th_w2 = st_wtight，th_walk/th_walk2/th_turn/th_turn2 同上取帧，th_valley/th_valley2 = 风景两种景别
    valley.jpg      = 原样片 gallery/videos/audio-app-ui-media.mp4 第 14.3 s 的帆船风景（裁掉左下节拍胶囊，crop=1138:640:71:0，放大到 1920x1080），没有人物；st_valley.jpg 是它的 640 宽版，st_valley2.jpg 是近景（crop=1100:619:560:330）
  画面里没有任何文字或图形压在 Harry 脸上；全屏结尾只有左下角的节拍灯胶囊。
-->

<script>
const S = STUDIO;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, d, e) => S.seg(t, a, d, e);
const mix = S.mix;
const CLAY = '#D97757';
// static markup helper (all strings below are fixed, written here)
function put(el, html) { const r = document.createRange(); r.selectNodeContents(el); el.appendChild(r.createContextualFragment(html)); return el; }
function mk(tag, cls, css, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (css) d.style.cssText = css; if (html) put(d, html); return d; }

// Claude star
function starPath() {
  let d = '';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.13, r = i % 2 ? 9.2 : 8.2, x = Math.cos(a), y = Math.sin(a);
    d += `M${(x*1.6).toFixed(2)} ${(y*1.6).toFixed(2)}L${(x*r).toFixed(2)} ${(y*r).toFixed(2)}`;
  }
  return d;
}
document.querySelectorAll('svg.star').forEach(s => put(s, `<path d="${starPath()}" stroke="${CLAY}" stroke-width="2.3" stroke-linecap="round"/>`));

// ---------- the edit (edit seconds; every cut on a 0.5 s beat at 120 BPM) ----------
// repeated shots use a second framing (jump-cut punch-in, closer walk, over-the-shoulder, tighter valley)
const SHOTS = [ ['w',0,2],['walk',2,3],['turn',3,4],['valley',4,5],['w2',5,7],['turn2',7,7.5],['valley2',7.5,8.5],['walk2',8.5,10.5],['w',10.5,16] ];
const CUTS = [2,3,4,5,7,7.5,8.5,10.5];
const VOICE = [[0.15,1.9],[5.15,6.9],[10.7,15.5]];
const EDIT = 16, LX0 = 6, PXS = 610 / EDIT;
const ex = (e) => LX0 + e * PXS;
const shotAt = (e) => { for (const s of SHOTS) if (e >= s[1] && e < s[2]) return s[0]; return 'w'; };
const TH = { w: 'media/th_w1.jpg', w2: 'media/th_w2.jpg', walk: 'media/th_walk.jpg', walk2: 'media/th_walk2.jpg', turn: 'media/th_turn.jpg', turn2: 'media/th_turn2.jpg', valley: 'media/th_valley.jpg', valley2: 'media/th_valley2.jpg' };
SHOTS.forEach((s, i) => {
  const img = TH[s[0]];

  for (let r = 0; r < PROWS; r++) { const m = PTOP - r; if (!isBlack(m)) continue; const y = PR_Y0 + r * ROWH;
    g.fillStyle = '#151515'; rr(g, 0, y + 1, 56, ROWH - 2, 2); g.fill();
    if (lit[m]) { g.globalAlpha = lit[m]; g.fillStyle = CLAY; rr(g, 0, y + 1, 56, ROWH - 2, 2); g.fill(); g.globalAlpha = 1; } }
  g.font = FONT(600, 8); g.fillStyle = '#777'; g.fillText('C4', 72, noteY(60) + ROWH - 3); g.fillText('C3', 72, noteY(48) + ROWH - 3);
  CH.forEach((c, i) => {
    const tag = seg(t, TC[i] - 0.05, 0.35, 'back.out(2.2)');
    if (tag > 0) { const x = PG_X0 + 2 * i * BARW + 20, tw = c.n.length > 1 ? 26 : 18; g.save(); g.translate(x + tw / 2, 9); g.scale(tag, tag); rr(g, -tw / 2, -8, tw, 16, 4); g.fillStyle = CLAY; g.fill();
      g.fillStyle = '#fff'; g.font = FONT(700, 10); g.fillText(c.n, -g.measureText(c.n).width / 2, 3.5); g.restore(); }
    [...c.notes, c.bass].forEach((m, k) => {
      const tp = TC[i] + k * 0.045, p = seg(t, tp, 0.35, 'back.out(2.2)'); if (p <= 0) return;
      const x = PG_X0 + 2 * i * BARW + 2 + (k === 4 ? BARW : 0), len = (k === 4 ? BARW : 2 * BARW) - 4, y = noteY(m) + 1.5;
      const fresh = clamp(1 - (t - tp - 0.25) / 0.45, 0, 1);
      g.save(); g.translate(x, y + (ROWH - 3) / 2); g.scale(1, p);
      rr(g, 0, -(ROWH - 3) / 2, len * Math.min(1, p * 1.2), ROWH - 3, 2);
      g.fillStyle = fresh > 0 ? `rgb(${mix(82, 160, fresh) | 0},${mix(119, 118, fresh) | 0},${mix(184, 150, fresh) | 0})` : '#5277B8'; g.fill();
      if (fresh > 0) { g.globalAlpha = fresh; g.strokeStyle = CLAY; g.lineWidth = 1.2; g.stroke(); g.globalAlpha = 1; }
      g.restore();
    });
  });
  if (t >= 10) { const x = PG_X0 + (playheadE(t) / 2) * BARW; if (x < w) { g.fillStyle = '#DADADA'; g.fillRect(x, PR_Y0, 1.3, PR_H); } }
}

// ---------- draw: mixer ----------
const STRIPS = [['Chords', '#4F6FA8'], ['Drums', '#3C8584'], ['Score', '#3E7D5C'], ['Voice', '#7069C4'], ['Reverb', '#5C5C5C'], ['Out', '#A0A0A0']];
const FAD0 = [0.62, 0.66, 0.58, 0.7, 0.48, 0.64];
function drawMixer(t) {
  const { g, w, h } = cvM; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
  STRIPS.forEach(([n, col], i) => {
    const x = 10 + i * 89;
    g.fillStyle = '#191919'; rr(g, x, 4, 82, 376, 5); g.fill();
    g.fillStyle = '#262626'; rr(g, x + 6, 10, 70, 17, 3); g.fill(); rr(g, x + 6, 31, 70, 17, 3); g.fill();
    g.fillStyle = '#8E8E8E'; g.font = FONT(500, 10); g.fillText('EQ', x + 12, 22); g.fillText('Comp', x + 12, 43);
    g.beginPath(); g.arc(x + 41, 74, 10, 0, Math.PI * 2); g.fillStyle = '#2C2C2C'; g.fill();
    const pa = -Math.PI / 2 + [-.4, .3, 0, .2, -.2, 0][i]; g.strokeStyle = '#CFCFCF'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x + 41, 74); g.lineTo(x + 41 + Math.cos(pa) * 8, 74 + Math.sin(pa) * 8); g.stroke();
    const fy0 = 102, fy1 = 340;
    g.fillStyle = '#0F0F0F'; g.fillRect(x + 22, fy0, 4, fy1 - fy0);
    let fv = FAD0[i];
    if (i === 2 && t >= 10) fv = 0.3 + 0.4 * autoLevel(t - 10, t);   // score fader rides the automation
    const fyy = fy1 - fv * (fy1 - fy0);
    g.fillStyle = '#BDBDBD'; rr(g, x + 10, fyy - 5, 28, 10, 2); g.fill(); g.fillStyle = '#555'; g.fillRect(x + 12, fyy - 0.5, 24, 1);
    for (let ch = 0; ch < 2; ch++) {
      const mx = x + 50 + ch * 12, mw = 8;
      g.fillStyle = '#0E0E0E'; g.fillRect(mx, fy0, mw, fy1 - fy0);
      const L = (tt) => clamp(stripLvl(tt, i) * (ch ? 0.93 : 1) + (ch ? 0.03 * Math.sin(tt * 23) : 0), 0, 1);
      const lv = L(t); let pk = 0; for (let k = 0; k < 20; k++) pk = Math.max(pk, L(t - k * 0.04));
      const segs = 30, sh = (fy1 - fy0) / segs;
      for (let s = 0; s < Math.round(lv * segs); s++) { g.fillStyle = s > 26 ? '#C9B458' : '#4F9271'; g.fillRect(mx + 0.5, fy1 - (s + 1) * sh + 1, mw - 1, sh - 1.6); }
      if (pk > 0.04) { g.fillStyle = '#D9D9D9'; g.fillRect(mx, fy1 - pk * (fy1 - fy0), mw, 1.6); }
    }
    g.fillStyle = col; rr(g, x + 6, 352, 70, 22, 5); g.fill();
    g.fillStyle = i === 5 ? '#151515' : '#F2F2F2'; g.font = FONT(650, 11); g.fillText(n, x + 41 - g.measureText(n).width / 2, 367);
  });
}

// ---------- render(t) ----------
const app = $('app'), tilt = $('tilt'), cur = $('cur'), badge = $('badge');
const panels = ['pMovie','pTempo','pTracks','pPiano','pMixer','pAI'].map($);
const extras = { pTracks: ['laneHeads','thumbs','cvT'], pPiano: ['cvP'], pMixer: ['cvM'], pAI: ['aiTabs','libList','aiInput'], pMovie: ['mv'] };
const RINGS = { rgAI: [[0.9, 1.85], [9.55, 10.1]], rgTracks: [[1.85, 3.45], [6.8, 9.5]], rgTempo: [[3.5, 4.45]], rgPiano: [[4.5, 6.75]], rgMovie: [[10.1, 12.05]] };

function render(t) {
  const ip = seg(t, 0, 1.45, 'expo.out');
  tilt.style.transform = `scale(${mix(0.8, 1, ip)}) rotateX(${mix(16, 0, ip)}deg) rotateY(${mix(-13, 0, ip)}deg)`;
  tilt.style.opacity = mix(0.55, 1, seg(t, 0, 0.6, 'power2.out'));
  const [cx, cy, s] = camAt(t);
  app.style.transform = `translate(${960 - cx * s}px, ${540 - cy * s}px) scale(${s})`;
  const toScreen = (x, y) => [960 + (x - cx) * s, 540 + (y - cy) * s];

  panels.forEach((p, i) => {
    const k = seg(t, -0.12 + i * 0.07, 0.7, 'expo.out'), tf = `translateY(${(1 - k) * 26}px)`;
    p.style.opacity = k; p.style.transform = tf;
    (extras[p.id] || []).forEach(id => { const el = $(id); el.style.opacity = k; el.style.transform = tf; });
  });
  $('ctrl').style.opacity = seg(t, -0.1, 0.6, 'expo.out');
  for (const id in RINGS) { let o = 0; RINGS[id].forEach(([a, b]) => { o = Math.max(o, seg(t, a, 0.2, 'power2.out') - seg(t, b, 0.25, 'power2.in')); }); $(id).style.opacity = o; }

  // AI panel
  const tabP = seg(t, 0.85, 0.3, 'power3.inOut');
  $('tabLib').style.color = tabP > 0.5 ? '#8E8E8E' : '#E2E2E2';
  $('tabLine').style.left = mix(1440, 1512, tabP) + 'px'; $('tabLine').style.width = mix(46, 64, tabP) + 'px';
  $('tabAI').style.opacity = mix(0.55, 1, tabP);
  $('libList').style.opacity = seg(t, -0.12 + 5 * 0.07, 0.7, 'expo.out') * (1 - seg(t, 0.85, 0.2, 'power2.in'));
  const hp = seg(t, 0.95, 0.6, 'expo.out'); $('aiHead').style.opacity = hp; $('aiHead').style.transform = `translateY(${(1 - hp) * 14}px)`;
  const bp = seg(t, 1.12, 0.35, 'back.out(2.2)'); $('bubble').style.opacity = Math.min(1, bp * 2); $('bubble').style.transform = `scale(${0.85 + 0.15 * bp})`;
  rowEls.forEach((r, i) => {
    const k = seg(t, 1.42 + i * 0.07, 0.7, 'expo.out'); r.style.opacity = k; r.style.transform = `translateY(${(1 - k) * 16}px)`;
    const [a, d] = PLAN[i];
    const act = Math.max(0, seg(t, a, 0.15, 'power2.out') - seg(t, d, 0.2, 'power2.in'));
    r.style.borderColor = `rgba(217,119,87,${act})`;
    r.style.background = act > 0 ? `rgba(217,119,87,${0.07 * act})` : '#1E1E1E';
    r.querySelector('.tx').style.color = t >= a ? '#E2E2E2' : '#8E8E8E';
    const ok = seg(t, d, 0.35, 'back.out(2.6)'), okEl = r.querySelector('.ok'); okEl.style.opacity = Math.min(1, ok * 2); okEl.style.transform = `scale(${ok})`;
    if (i === 5) { const sp = r.querySelector('.spin'); sp.style.opacity = (t >= 10.0 && t < 12.0) ? 1 : 0; sp.style.transform = `rotate(${t * 400}deg)`; }
  });

  // transport + tempo
  const bpm = bpmAt(t), e = playheadE(t);
  $('lcdPos').textContent = lcdText(e, bpm);
  $('lcdBpm').textContent = bpm.toFixed(1); $('bpmBig').textContent = bpm.toFixed(1);
  const snap = t > 4.42 ? Math.exp(-(t - 4.42) * 6) : 0;
  $('bpmBig').style.color = snap > 0.05 ? `rgb(${mix(226, 217, snap) | 0},${mix(226, 119, snap) | 0},${mix(226, 87, snap) | 0})` : '#E2E2E2';
  $('playBtn').style.background = playing(t) ? '#3E9B5B' : '#1F1F1F';
  const beatIdx = Math.floor(e * bpm / 60 + 1e-6) % 4;
  lights.forEach((l, i) => { l.style.background = (playing(t) && i === beatIdx) ? CLAY : '#3A3A3A'; });

  // Movie window: the shot under the playhead
  const shot = shotAt(e), live = t >= 11.9 && shot === 'walk';
  $('vWeb').style.opacity = shot === 'w' ? 1 : 0;
  $('sWalk').style.opacity = shot === 'walk' && !live ? 1 : 0;
  $('vWalkA').style.opacity = live ? 1 : 0;
  $('sTurn').style.opacity = shot === 'turn' ? 1 : 0;
  $('sValley').style.opacity = shot === 'valley' ? 1 : 0;
  ['W2','Walk2','Turn2','Valley2'].forEach(n => { $('s' + n).style.opacity = shot === n.toLowerCase() ? 1 : 0; });
  pillS.forEach((d, i) => { const on = playing(t) && i === beatIdx; d.style.background = on ? CLAY : '#8E8E8E'; d.style.opacity = on ? 1 : 0.55; });
  $('pillS').style.opacity = t >= 10 ? 1 : 0;
  $('dim').style.opacity = 0.6 * seg(t, 11.9, 0.9, 'power1.inOut');

  drawTracks(t); drawPiano(t); drawMixer(t);

  // cursor + badge (badge flips left near the frame edge)
  const [px, py] = cursorAt(t);
  const press = CLICKS.some(c => t >= c[0] - 0.04 && t < c[0] + 0.1) ? 0.86 : 1;
  cur.style.transform = `translate(${px - 2}px, ${py - 2}px) scale(${press})`;
  const cv = Math.max(0, seg(t, 1.3, 0.25, 'power2.out') - seg(t, 12.0, 0.15, 'power2.in'));
  cur.style.opacity = cv;
  const lab = stepLabel(t);
  $('badgeStep').textContent = lab ? '· ' + lab : '';
  const [sx, sy] = toScreen(px, py);
  const bs = Math.min(1.9, Math.max(1, s * 0.85)), bw = badge.offsetWidth * bs;
  const flip = sx + 22 * bs + bw > 1880;
  badge.style.transform = `translate(${flip ? sx - 14 * bs - bw : sx + 22 * bs}px, ${sy + 24 * bs}px) scale(${bs})`;
  badge.style.opacity = cv;
  CLICKS.forEach((c, i) => { const a = t - c[0], el = ringEls[i]; if (a < 0 || a > 0.5) { el.style.opacity = 0; return; }
    const r = 6 + 26 * S.ease('power2.out')(a / 0.5); el.style.opacity = 1 - a / 0.5; el.style.left = (c[1] - r) + 'px'; el.style.top = (c[2] - r) + 'px'; el.style.width = el.style.height = (2 * r) + 'px'; });

  // full-frame finish: switches in once the Movie window fills the frame
  const full = t >= 12.85; $('full').style.opacity = full ? 1 : 0;
  $('vWalkB').style.opacity = t < 13.0 ? 1 : 0;
  $('vTurn').style.opacity = t >= 13.0 && t < 14.0 ? 1 : 0;
  $('fValley').style.opacity = t >= 14.0 ? 1 : 0;
  const b = (t - 10) / 0.5, k = Math.floor(b + 1e-6), ph = (b - k) * 0.5;
  const hitT = 10 + k * 0.5, isCut = Math.abs(hitT - 13.0) < 1e-3 || Math.abs(hitT - 14.0) < 1e-3;
  const punch = full ? (isCut ? 0.03 : 0.018) * Math.exp(-ph * 9) : 0;
  const push = 0.04 * seg(t, 13.0, 2.0, 'power1.inOut');
  $('fullIn').style.transform = `scale(${1 + push + punch})`;
  pillF.forEach((d, i) => { const on = i === beatIdx; d.style.background = on ? CLAY : '#8E8E8E'; d.style.opacity = on ? 1 : 0.55; });
}
window.__timelines = window.__timelines || {};
window.__timelines["main"] = S.play(render, { loop: false });
</script>
