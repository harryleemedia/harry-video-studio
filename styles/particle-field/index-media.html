              } else {
                if (CM > 0) {
                  spr = spriteQ(POINT[0] + (TR[i] - POINT[0]) * CM, POINT[1] + (TG[i] - POINT[1]) * CM, POINT[2] + (TB[i] - POINT[2]) * CM);
                  al *= 0.85 + 0.3 * Math.sin(tt * 2.3 + R1[i] * TAU); // twinkle
                  if (scA > 0) { const q = (TY[i] - scY) / 80; al *= 1 + 1.3 * scA * Math.exp(-q * q); }
                }
                al *= PF;
              }
              ctx.globalAlpha = al > 1 ? 1 : al;
              const sz = (cy ? 4.8 : 3.8) * s * (0.85 + 0.3 * R1[i]);
              ctx.drawImage(spr, sx - sz / 2, sy - sz / 2, sz, sz);
            }
          }
          // compose: ink ground, points, soft light from density only, grain
          ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
          b1.globalCompositeOperation = 'copy'; b1.drawImage(PL, 0, 0, 960, 540);
          b2.globalCompositeOperation = 'copy'; b2.drawImage(B1, 0, 0, 480, 270);
          b3.globalCompositeOperation = 'copy'; b3.drawImage(B2, 0, 0, 240, 135);
          b4.globalCompositeOperation = 'copy'; b4.drawImage(B3, 0, 0, 120, 68);
          out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1;
          out.fillStyle = bg; out.fillRect(0, 0, W, H);
          const glow = io3(clamp((t - 11.9) / 1.4, 0, 1));
          if (glow > 0) backlight(zoom, glow);
          if (res > 0) photo(t, zoom, res, 14 * (1 - res));
          out.globalCompositeOperation = 'lighter';
          out.drawImage(PL, 0, 0);
          out.imageSmoothingQuality = 'high';
          out.globalAlpha = 0.5; out.drawImage(B3, 0, 0, W, H);
          out.globalAlpha = 0.65; out.drawImage(B4, 0, 0, W, H);
          out.globalCompositeOperation = 'overlay';
          out.globalAlpha = 0.07;
          out.fillStyle = GRAIN[Math.floor(t * 30 + 0.001) % 4];
          out.fillRect(0, 0, W, H);
          out.globalCompositeOperation = 'source-over';
          out.globalAlpha = 1;
        }

        const p = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(p, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(p.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['main'] = tl;
        draw(0);
        // redraw once the photo has decoded (only matters if a seek lands before it loads)
        if (!img.complete) img.addEventListener('load', () => draw(p.t));
      })();
    </script>
  </body>
</html>
