<!doctype html>
<!--
  editor-ui · With media（Harry 版）
  媒体文件（放进项目的 media/ 文件夹，原件在 $ZH/assets/me/，不要改原件）：
    - media/webcam.mp4    ← assets/me/webcam.mp4（Harry 对镜头讲话，4:5）
    - media/roomblur.jpg  ← 由 webcam.mp4 截一帧，裁 16:9、高斯模糊（侧边补底用）
    - media/thumb1-3.jpg  ← 由 webcam.mp4 截 3 帧（素材箱缩略图，16:9 模糊补边）
    - media/filmstrip.jpg ← 由 webcam.mp4 截 10 帧拼成一条（V1 轨胶片条）
  生成命令见本文件末尾注释。4:5 画面放进 16:9：中间是完整的 Harry（脸完整），两侧是同一画面的模糊放大。
  字幕和下三分之一条都放在脸以下 / 脸的左侧，永远不盖脸。
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Switzer comes from the Fontshare link above (free, loaded at render time, never shipped). This local() rule only satisfies the linter. */
  @font-face { font-family: 'Switzer'; src: local('Switzer'); font-weight: 100; }
  :root {
    --win: #121212; --bar: #191919; --hair: #232323; --hair2: #262626; --panel: #1D1D1D;
    --row: #232323; --rowline: #2B2B2B; --tile: #2D2D2D;
    --text: #EDEDED; --body: #E2E2E2; --dim: #7E7E7E;
    --vid: #4C478A; --vidE: #7C76C4; --aud: #234A3A; --audE: #3C7F61; --gfx: #3E414B; --gfxE: #646876;
    --clay: #D97757;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070708; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #1B1B1D 0%, #0d0d0e 60%, #070708 100%);
    font-family: 'Switzer', sans-serif; color: var(--text); }
  .a { position: absolute; }
  #stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 960px 540px; }
  #app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform-style: preserve-3d; }
  #win { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border-radius: 14px; background: var(--win);
    border: 1px solid var(--hair2); box-shadow: 0 50px 160px rgba(0,0,0,0.75); }
  .panel { position: absolute; border-radius: 8px; background: var(--panel); overflow: hidden; }
  .phead { position: absolute; left: 0; top: 0; right: 0; height: 34px; border-bottom: 1px solid var(--hair2); }
  .tab { position: absolute; top: 0; height: 34px; line-height: 34px; font-size: 14px; font-weight: 600; color: var(--dim); white-space: nowrap; }
  .tab.on { color: var(--text); }
  .uline { position: absolute; height: 2px; background: var(--text); border-radius: 1px; }
  .lbl { position: absolute; white-space: nowrap; }
  .tc { font-variant-numeric: tabular-nums; }
  .pic { position: absolute; overflow: hidden; background: #000; border-radius: 2px; }
  .frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0b0b0b; }
  .foot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .before { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .room { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: url(media/roomblur.jpg) center / cover no-repeat; filter: brightness(0.78) saturate(1.05); }
  .fgv { position: absolute; left: 528px; top: 0; width: 864px; height: 1080px; object-fit: cover;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%); }
  .broll { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
  .broll svg, .thumb svg, .v2c svg, #ghost svg { display: block; width: 100%; height: 100%; }
  .warm { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #FF9448; mix-blend-mode: soft-light; opacity: 0; }
  .caps { position: absolute; left: 0; top: 752px; width: 1920px; height: 130px; }
  .cline { position: absolute; left: 0; top: 0; width: 1920px; height: 130px; display: flex; justify-content: center; align-items: center; gap: 4px; }
  .w { display: inline-block; padding: 2px 16px 8px; border-radius: 12px; font-weight: 800; font-size: 72px; letter-spacing: -0.03em; line-height: 1;
    color: #fff; text-shadow: 0 4px 22px rgba(0,0,0,0.6); }
  .w.serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 92px; letter-spacing: 0; padding: 0 18px 6px; }
  .lt { position: absolute; left: 96px; top: 600px; width: 470px; height: 116px; }
  .ltbar { position: absolute; left: 0; top: 0; width: 12px; height: 116px; background: var(--clay); transform-origin: 50% 100%; }
  .ltplate { position: absolute; left: 12px; top: 0; width: 458px; height: 116px; background: rgba(16,16,16,0.84); }
  .ltname { position: absolute; left: 40px; top: 14px; font-size: 50px; font-weight: 800; letter-spacing: -0.03em; color: #fff; white-space: nowrap; }
  .ltsub { position: absolute; left: 41px; top: 72px; font-size: 25px; font-weight: 600; color: #cfcfcf; white-space: nowrap; }
  .spark { position: absolute; }
  .row { position: absolute; left: 16px; width: 432px; height: 56px; border-radius: 9px; background: var(--row); border: 1px solid var(--rowline); }
  .clipbox { position: absolute; border-radius: 5px; overflow: hidden; }
  .thumb { position: absolute; width: 196px; height: 110px; border-radius: 6px; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.65); font-size: 12px; font-weight: 600; color: #eee; }
  .aib { position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 6px; background: #2D2D2D; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--clay); opacity: 0; }
  #focus { position: absolute; border: 2px solid var(--clay); border-radius: 9px; box-shadow: 0 0 0 1px rgba(217,119,87,0.25), 0 0 24px rgba(217,119,87,0.12); opacity: 0; }
  #cursor { position: absolute; left: 0; top: 0; width: 120px; height: 60px; transform-origin: 0 0; opacity: 0; }
  #ghost { position: absolute; width: 120px; height: 68px; border-radius: 6px; overflow: hidden; border: 2px solid var(--clay); box-shadow: 0 18px 40px rgba(0,0,0,0.6); opacity: 0; }
  #final { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; }
  #streaks, #grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #grain { opacity: 0.07; mix-blend-mode: overlay; image-rendering: auto; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(217,119,87,0.85) 0%, rgba(217,119,87,0.25) 35%, rgba(217,119,87,0) 70%);
    mix-blend-mode: screen; opacity: 0; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.42) 100%); pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
  <div id="stage"><div id="app"><div id="win"></div></div></div>

  <!-- the footage frames (1920x1080 each). JS moves fSrc / fPrg into the monitors. -->
  <div class="frame" id="fSrc"><div class="foot">
    <div class="room"></div>
    <video id="vSrc" class="clip fgv" src="media/webcam.mp4" muted playsinline data-start="0" data-duration="8.6" data-media-start="17"></video>
  </div></div>
  <div class="frame" id="fPrg"><div class="foot">
    <div class="room"></div>
    <video id="vPrg" class="clip fgv" src="media/webcam.mp4" muted playsinline data-start="0" data-duration="14.8" data-media-start="2"></video>
  </div><div class="warm"></div><div class="before">
    <div class="room"></div>
    <video id="vPrgB" class="clip fgv" src="media/webcam.mp4" muted playsinline data-start="9.8" data-duration="1.3" data-media-start="11.8"></video>
  </div></div>

  <canvas id="streaks" width="1920" height="1080"></canvas>
  <div id="final"><div class="frame" id="fFin"><div class="foot">
    <div class="room"></div>
    <video id="vFin" class="clip fgv" src="media/webcam.mp4" muted playsinline data-start="14.5" data-duration="3.5" data-media-start="16.5"></video>
  </div><div class="warm"></div></div></div>
  <div id="flash"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="vig"></div>
</div>
<script>
/* ---------- one clock (inline copy of studio.js) ---------- */
(function () {
  const R = () => document.querySelector('[data-composition-id]');
  const cache = {};
  const S = {
    get root() { return R(); }, get D() { return +R().dataset.duration; },
    ease(n) { return cache[n] || (cache[n] = n === 'none' ? (p) => p : gsap.parseEase(n)); },
    seg(t, s, d, e) { const p = Math.min(1, Math.max(0, (t - s) / d)); return S.ease(e || 'power3.out')(p); },
    mix(a, b, p) { return a + (b - a) * p; },
    rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
    play(render) {
      const D = S.D, clock = { t: 0 }, tl = gsap.timeline({ paused: true });
      const draw = () => render(clock.t);
      tl.to(clock, { t: D, duration: D, ease: 'none', onUpdate: draw }, 0);
      draw();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
      window.addEventListener('load', draw);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      return tl;
    },
  };
  window.STUDIO = S;
})();

const S = STUDIO, seg = S.seg, mix = S.mix;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const px = (v) => v + 'px';
const $ = (id) => document.getElementById(id);
function el(parent, cls, css, html) { const d = document.createElement('div'); if (cls) d.className = cls;
  Object.assign(d.style, css || {}); if (html != null) d.innerHTML = html; parent.appendChild(d); return d; }
const CLAY = '#D97757';

/* ---------- drawings ---------- */
function sparkSVG(color, sw) {
  let p = '';
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + 0.13, L = k % 2 ? 34 : 46;
    p += `<line x1="${(Math.cos(a) * 9).toFixed(1)}" y1="${(Math.sin(a) * 9).toFixed(1)}" x2="${(Math.cos(a) * L).toFixed(1)}" y2="${(Math.sin(a) * L).toFixed(1)}"/>`; }
  return `<svg viewBox="-50 -50 100 100" width="100%" height="100%" style="display:block;overflow:visible"><g stroke="${color}" stroke-width="${sw || 9}" stroke-linecap="round">${p}</g></svg>`;
}
function landscapeSVG() {
  const r = S.rng(11); let trees = '';
  for (let k = 0; k < 16; k++) { const x = 80 + k * 118 + r() * 50, y = 700 + Math.sin(k * 0.9) * 50 + r() * 40, h = 90 + r() * 70;
    trees += `<path d="M${x} ${y - h} L${x - h * 0.28} ${y} L${x + h * 0.28} ${y} Z" fill="#5E7B60"/><rect x="${x - 5}" y="${y}" width="10" height="22" fill="#6C5E4B"/>`; }
  return `<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#EDE6CF"/>
  <circle cx="1360" cy="300" r="150" fill="#F6E3B8"/><circle cx="1360" cy="300" r="105" fill="#F2D49A"/>
  <path d="M0 560 L240 420 L420 520 L640 380 L880 540 L1120 430 L1380 560 L1620 440 L1920 540 L1920 1080 L0 1080 Z" fill="#CAD4B6"/>
  <path d="M0 680 C300 560 520 640 760 600 C1000 560 1240 660 1500 600 C1700 560 1820 600 1920 620 L1920 1080 L0 1080 Z" fill="#ABBE98"/>
  <path d="M0 820 C360 720 700 800 980 760 C1260 720 1560 800 1920 760 L1920 1080 L0 1080 Z" fill="#91A982"/>
  <path d="M900 620 C820 700 1060 760 900 840 C760 910 1080 980 980 1080 L1180 1080 C1260 980 960 920 1100 840 C1240 760 990 700 1040 620 Z" fill="#D6E6DF"/>
  ${trees}
  <path d="M520 220 l22 14 l22 -14 M600 180 l16 10 l16 -10 M1640 160 l18 12 l18 -12" stroke="#6B6A5A" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
}
function citySVG() {
  const r = S.rng(23), W = 150, H = 75, ox = 960, oy = 150; let g = '';
  for (let s = 0; s < 14; s++) for (let i = 0; i < 8; i++) { const j = s - i; if (j < 0 || j > 7) continue;
    const x = ox + (i - j) * W / 2, y = oy + (i + j) * H / 2, v = r();
    const top = (yy) => `M${x} ${yy} L${x + W / 2} ${yy + H / 2} L${x} ${yy + H} L${x - W / 2} ${yy + H / 2} Z`;
    if (v < 0.22) { g += `<path d="${top(y)}" fill="#DCEDD3" stroke="#C7DABD" stroke-width="2"/><circle cx="${x}" cy="${y + H / 2 - 12}" r="16" fill="#9CC48E"/>`; continue; }
    const h = 40 + r() * 190, yt = y - h;
    g += `<path d="M${x - W / 2 + 8} ${y + H / 2} L${x} ${y + H - 4} L${x} ${y + H - 4 - h} L${x - W / 2 + 8} ${y + H / 2 - h} Z" fill="#D5CFE3"/>`;
    g += `<path d="M${x} ${y + H - 4} L${x + W / 2 - 8} ${y + H / 2} L${x + W / 2 - 8} ${y + H / 2 - h} L${x} ${y + H - 4 - h} Z" fill="#B6AECF"/>`;
    g += `<path d="M${x} ${yt + 4} L${x + W / 2 - 8} ${yt + H / 2} L${x} ${yt + H - 4} L${x - W / 2 + 8} ${yt + H / 2} Z" fill="#F4F1EA"/>`;
    for (let f = 1; f < h / 34; f++) g += `<path d="M${x + 14} ${y + H - 4 - f * 34 - 8} L${x + W / 2 - 20} ${y + H / 2 - f * 34 + 2}" stroke="#9E96BE" stroke-width="5"/>`;
  }
  return `<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#C7E6EC"/>
  <path d="M960 110 L1640 450 L960 790 L280 450 Z" fill="#E7F1E0" transform="translate(0 70)"/>${g}</svg>`;
}
function codeSVG() {
  let lines = ''; const ws = [420, 300, 560, 360, 480, 250, 520, 340];
  const cs = ['#8FB7FF', '#E6EAF2', '#F2A285', '#E6EAF2', '#8FB7FF', '#E6EAF2', '#9FE0B9', '#E6EAF2'];
  ws.forEach((w, k) => { lines += `<rect x="${830 + (k % 3 === 1 ? 50 : 0)}" y="${390 + k * 46}" width="${w}" height="18" rx="9" fill="${cs[k]}" opacity="0.9"/>`; });
  return `<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect width="1920" height="1080" fill="#EEF0F4"/>
  <rect x="220" y="170" width="1480" height="740" rx="36" fill="#fff" stroke="#DDE1E8" stroke-width="3"/>
  <rect x="290" y="232" width="44" height="44" rx="10" fill="#1F2A44"/><text x="356" y="268" font-family="Switzer, sans-serif" font-weight="700" font-size="38" fill="#1F2430">Code</text>
  <path d="M420 560 C520 560 560 470 660 470 L760 470" stroke="#C9CDD6" stroke-width="6" fill="none"/>
  <circle cx="400" cy="560" r="62" fill="#FBEDE7"/><g transform="translate(400 560) scale(0.9)">${sparkSVG(CLAY, 9).replace(/<svg[^>]*>|<\/svg>/g, '')}</g>
  <rect x="760" y="330" width="860" height="500" rx="24" fill="#1F2A44"/>${lines}</svg>`;
}
const BROLL = [landscapeSVG(), citySVG(), codeSVG()];

/* ---------- a footage frame: grade, b-roll, wipe, spark, lower third, captions ---------- */
function makeFrame(fr, o) {
  const F = { fr, foot: fr.querySelector('.foot'), warm: fr.querySelector('.warm'), before: fr.querySelector('.before') };
  F.broll = BROLL.map((svg) => el(F.foot, 'broll', {}, svg));
  if (o.wipe) {
    F.wline = el(fr, 'a', { left: 0, top: 0, width: '5px', height: '1080px', background: '#fff', boxShadow: '0 0 18px rgba(0,0,0,0.5)', opacity: 0 });
    F.whandle = el(fr, 'a', { left: 0, top: px(440), width: '64px', height: '64px', borderRadius: '50%', background: 'rgba(255,255,255,0.18)',
      border: '5px solid #fff', opacity: 0 }, '<svg viewBox="0 0 54 54" width="54" height="54"><path d="M20 18 L11 27 L20 36 M34 18 L43 27 L34 36" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    const tag = (txt, side) => el(fr, 'a', Object.assign({ top: '40px', padding: '8px 18px', borderRadius: '10px', background: 'rgba(10,10,10,0.55)',
      fontSize: '34px', fontWeight: 650, color: '#fff', opacity: 0 }, side), txt);
    F.tagB = tag('Before', { left: '40px' }); F.tagA = tag('After', { right: '40px' });
  }
  if (o.spark) F.spark = el(fr, 'spark', { left: px(1595), top: px(610), width: '110px', height: '110px', opacity: 0 }, sparkSVG(CLAY, 8));
  if (o.lt) {
    F.lt = el(fr, 'lt'); F.ltbar = el(F.lt, 'ltbar'); F.ltplate = el(F.lt, 'ltplate');
    F.ltname = el(F.ltplate, 'ltname', {}, 'Harry Lee'); F.ltsub = el(F.ltplate, 'ltsub', {}, '@harryleeai');
  }
  if (o.caps) {
    const caps = el(fr, 'caps');
    const mk = (words) => { const line = el(caps, 'cline');
      return words.map((w) => { const s = document.createElement('span'); s.className = 'w' + (w === 'Claude' ? ' serif' : ''); s.textContent = w; line.appendChild(s); return s; }); };
    F.L1 = mk(['Everything', "you're", 'seeing']); F.L2 = mk(['was', 'built', 'by', 'Claude']);
  }
  return F;
}
function drawFrame(F, st, t) {
  const g = st.grade;
  F.foot.style.filter = g > 0.001 ? `saturate(${1 + 0.24 * g}) sepia(${0.14 * g}) contrast(${1 + 0.08 * g}) brightness(${1 + 0.03 * g})` : 'none';
  if (F.warm) F.warm.style.opacity = 0.32 * g;
  F.broll.forEach((b, i) => { b.style.opacity = st.broll === i ? 1 : 0; });
  if (F.before) {
    const on = st.wipe != null && st.wipe.a > 0;
    F.before.style.opacity = on ? 1 : 0;
    const x = on ? st.wipe.x * 1920 : 0;
    F.before.style.clipPath = `inset(0 ${1920 - x}px 0 0)`;
    F.wline.style.opacity = on ? st.wipe.a : 0; F.wline.style.transform = `translateX(${x - 2.5}px)`;
    F.whandle.style.opacity = on ? st.wipe.a : 0; F.whandle.style.transform = `translateX(${x - 32}px) scale(${st.wipe ? st.wipe.press : 1})`;
    F.tagB.style.opacity = on ? st.wipe.a : 0; F.tagA.style.opacity = on ? st.wipe.a : 0;
  }
  if (F.spark) { const p = st.spark; F.spark.style.opacity = p > 0 ? 1 : 0;
    F.spark.style.transform = `scale(${S.ease('back.out(2)')(p)}) rotate(${t * 40}deg)`; }
  if (F.lt) {
    const L = st.lt, bar = seg(L, 0, 0.35, 'expo.out'), pl = seg(L, 0.12, 0.6, 'expo.out'), tx = seg(L, 0.3, 0.55, 'expo.out');
    F.lt.style.opacity = L > 0 ? 1 : 0;
    F.ltbar.style.transform = `scaleY(${bar})`;
    F.ltplate.style.clipPath = `inset(0 ${(1 - pl) * 100}% 0 0)`;
    F.ltname.style.transform = `translateY(${(1 - tx) * 30}px)`; F.ltname.style.opacity = tx;
    const ts = seg(L, 0.4, 0.55, 'expo.out'); F.ltsub.style.transform = `translateY(${(1 - ts) * 24}px)`; F.ltsub.style.opacity = ts;
  }
  if (F.L1) {
    const c = st.caps; // {l1:[times], l1out, l2:[times], pillOff}
    const word = (sp, tin, tout, pillA) => {
      const p = seg(t, tin, 0.34, 'back.out(2)');
      const o = tout != null ? seg(t, tout, 0.26, 'power2.in') : 0;
      sp.style.opacity = t < tin ? 0 : clamp(seg(t, tin, 0.12, 'none') * (1 - o), 0, 1);
      sp.style.transform = `translateY(${(1 - p) * 26 - o * 14}px) scale(${0.82 + 0.18 * p})`;
      sp.style.background = pillA > 0 ? `rgba(217,119,87,${(0.92 * pillA).toFixed(3)})` : 'transparent';
    };
    const live = (times, i, end) => { // pill on the newest word until the next one lands
      if (t < times[i]) return 0; const nx = i + 1 < times.length ? times[i + 1] : end;
      return 1 - seg(t, nx, 0.12, 'none'); };
    F.L1.forEach((sp, i) => word(sp, c.l1[i], c.l1out, live(c.l1, i, c.l1out)));
    F.L2.forEach((sp, i) => word(sp, c.l2[i], null, live(c.l2, i, c.pillOff)));
  }
}

/* ---------- the app ---------- */
const app = $('app'), win = $('win');

    o.pend.style.opacity = running || done ? 0 : 1;
    o.spin.style.opacity = running ? 1 : 0; o.spin.style.transform = `rotate(${t * 600}deg)`;
    const tp = seg(t, R0.d, 0.4, 'back.out(2.6)'); o.tick.style.opacity = done ? 1 : 0; o.tick.style.transform = `scale(${0.4 + 0.6 * tp})`;
    o.ck.style.strokeDashoffset = 1 - seg(t, R0.d + 0.05, 0.3, 'power2.out');
    if (o.pct) { o.pct.style.opacity = t >= 12.2 ? 1 : 0; o.pct.textContent = Math.round(ex * 100) + '%'; }
  });

  /* focus ring */
  const fr = focusRect(t);
  Object.assign(focus.style, { left: px(fr.x - 3), top: px(fr.y - 3), width: px(fr.w + 6), height: px(fr.h + 6) });
  focus.style.opacity = seg(t, 0.95, 0.3, 'none') * (1 - seg(t, 13.7, 0.2, 'none'));

  /* cursor, rings, drag ghost */
  const [cx, cy] = curPos(t), cs = Math.pow(s, -0.65);
  let dip = 1; PRESS.forEach((q) => { dip -= 0.16 * (seg(t, q - 0.05, 0.06, 'power2.out') - seg(t, q + 0.05, 0.15, 'power2.out')); });
  const dragging = DRAGS.some((d) => t >= d[0] && t < d[1]) || (t >= 8.62 && t < 9.2) || (t >= 10.07 && t < 10.55);
  if (dragging) dip = Math.min(dip, 0.9);
  cursor.style.opacity = seg(t, 4.45, 0.15, 'none') * (1 - seg(t, 13.65, 0.2, 'none'));
  cursor.style.transform = `translate(${cx - 4 * cs}px, ${cy - 3 * cs}px) scale(${cs * dip})`;
  rings.forEach((r, i) => { const q = PRESS[i], p = clamp((t - q) / 0.45, 0, 1); const on = t >= q && p < 1;
    const [rx2, ry2] = curPos(q); r.style.left = px(rx2); r.style.top = px(ry2);
    r.style.opacity = on ? 1 - p : 0; r.style.transform = `scale(${cs * (1 + 0.7 * S.ease('power2.out')(p))})`; });
  const dg = DRAGS.find((d) => t >= d[0] + 0.03 && t < d[1]);
  ghost.style.opacity = dg ? 0.94 : 0;
  if (dg) { if (ghost.dataset.k !== String(dg[3])) { ghost.innerHTML = BROLL[dg[3]]; ghost.dataset.k = String(dg[3]); }
    const gp = seg(t, dg[0], 0.2, 'back.out(2)'); ghost.style.transform = `translate(${cx - 60}px, ${cy - 30}px) scale(${0.6 + 0.4 * gp}) rotate(${-3 * gp}deg)`; }

  /* the dive: light streaks */
  sc.clearRect(0, 0, 1920, 1080);
  if (t > 14.05 && t < 14.95) {
    STK.forEach((k) => { const u = clamp((t - 14.05 - k.d * 0.4) / 0.6, 0, 1); if (u <= 0 || u >= 1) return;
      const r0 = 120 + u * u * 1500 * k.sp, r1 = r0 + 160 * k.len + u * 500 * k.len;
      sc.strokeStyle = k.clay ? `rgba(217,119,87,${0.9 * Math.sin(Math.PI * u)})` : `rgba(255,255,255,${0.75 * Math.sin(Math.PI * u)})`;
      sc.lineWidth = 2 + u * 2; sc.beginPath(); sc.moveTo(960 + Math.cos(k.a) * r0, 540 + Math.sin(k.a) * r0 * 0.75);
      sc.lineTo(960 + Math.cos(k.a) * r1, 540 + Math.sin(k.a) * r1 * 0.75); sc.stroke(); });
  }

  /* final full frame */
  $('final').style.opacity = t >= 14.65 ? 1 : 0;
  const push = 1 + 0.05 * seg(t, 14.65, 3.35, 'power1.inOut');
  $('fFin').style.transform = `translate(960px, 430px) scale(${push}) translate(-960px, -430px)`;
  drawFrame(FF, { grade: 1, broll: -1, spark: 1, lt: Math.max(0, t - 15.0), caps: CAP_F }, t);
  $('flash').style.opacity = 0.6 * (seg(t, 14.6, 0.06, 'none') - seg(t, 14.7, 0.45, 'power2.out'));

  drawGrain(t);
});
/*
  媒体生成（在 media/ 里运行，webcam.mp4 来自 assets/me/）：
  ffmpeg -ss 5 -i webcam.mp4 -frames:v 1 -vf "crop=864:486:0:178,scale=960:540,gblur=sigma=22,eq=brightness=-0.10:saturation=1.1" roomblur.jpg
  缩略图（T=3/11/21 → thumb1/2/3.jpg，400x225）与胶片条（T=1,3,…,19 每帧 112x63，再 tile=10x1 → filmstrip.jpg）：
  ffmpeg -ss T -i webcam.mp4 -frames:v 1 -filter_complex "[0:v]split[a][b];[a]crop=864:486:0:178,scale=W:H,gblur=sigma=12,eq=brightness=-0.10[bg];[b]scale=-2:H[fg];[bg][fg]overlay=(W-w)/2:0" out.jpg
*/
</script>
